[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neatcoder"
version = "0.1.0"
description = "A configurable GitHub pull-request review bot."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "google-cloud-tasks>=2.18,<3",
  "PyGithub>=2.5,<3",
  "PyJWT[crypto]>=2.10,<3",
  "openai>=2,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
neatcoder = "neatcoder.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neatcoder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["neatcoder"]
