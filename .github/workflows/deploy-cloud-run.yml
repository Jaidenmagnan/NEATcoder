name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: neatcoder-508419
  GCP_REGION: us-east1
  CLOUD_RUN_SERVICE: neatcoder

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy
        run: >-
          gcloud run deploy "$CLOUD_RUN_SERVICE"
          --source .
          --project "$GCP_PROJECT_ID"
          --region "$GCP_REGION"
          --allow-unauthenticated
          --set-secrets
          "NEATCODER_GITHUB_APP_ID=neatcoder-github-app-id:latest,NEATCODER_GITHUB_PRIVATE_KEY=neatcoder-github-private-key:latest,NEATCODER_WEBHOOK_SECRET=neatcoder-webhook-secret:latest,OPENAI_API_KEY=neatcoder-openai-api-key:latest,NEATCODER_TASK_SECRET=neatcoder-task-secret:latest"
          --set-env-vars
          "NEATCODER_GCP_PROJECT=neatcoder-508419,NEATCODER_TASK_LOCATION=us-east1,NEATCODER_TASK_QUEUE=neatcoder-reviews,NEATCODER_TASK_TARGET_URL=https://neatcoder-735836629222.us-east1.run.app/tasks/review"
          --quiet
